xt-decoration:underline 3px #d78d1e;text-underline-offset:4px}.word.correct{background:var(--green);text-decoration:underline 3px #258153;text-underline-offset:4px}.word.mistake{background:var(--red);color:#8f342c;text-decoration:underline 3px #b54034;text-underline-offset:4px}.spell-word{cursor:pointer;padding:2px 4px;border-radius:5px}.spell-word.selected{background:#fff0a6;text-decoration:underline 3px #d78d1e}.spell-word.correct{background:var(--green);text-decoration:underline 3px #258153}.spell-word.mistake{background:var(--red);color:#8f342c;text-decoration:line-through 2px #b54034}.scoreline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.pill{background:#edf2eb;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.progress{height:8px;background:#e4ebe5;border-radius:999px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--teal)}.done-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--green);color:#226241;font-size:12px;font-weight:900}.notdone-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef1ec;color:#66746e;font-size:12px;font-weight:800}.muted{color:#697770}.note{background:#fff6d7;border:1px solid #dfca7a;border-radius:13px;padding:12px 14px}.answer-key{font-size:13px;color:var(--red2);font-weight:800}.subhead{font-size:16px;font-weight:900;margin:12px 0 6px}.end{text-align:center}.bigscore{font-size:52px;font-weight:950;color:#176e66}.mini-table{width:100%;border-collapse:collapse}.mini-table th,.mini-table td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.secondary-link{border:0;background:none;color:#176e66;text-decoration:underline;cursor:pointer;font-weight:800;padding:8px 0}.question-line{font-size:18px}.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.irregular-table td:nth-child(1),.irregular-table th:nth-child(1){width:50%}.completion{font-size:13px;color:#617069;margin-top:8px}.sentence-line{font-size:18px;line-height:1.9}.gap-input{display:inline-block;width:150px;min-width:120px;padding:7px 9px;margin:0 5px;border:1px solid #aebeb2;border-radius:8px;background:#fff;vertical-align:middle}.gap-input.good{background:var(--green);border-color:#5a9e75}.gap-input.bad{background:var(--red);border-color:#cb6e64}.polarity{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:999px;font-weight:950;margin-right:8px}.polarity.pos{background:#e0f2e5;color:#1f7047}.polarity.neg{background:#fde7e4;color:#9e3b32}.conj-select{padding:10px 12px;border:1px solid #aebeb2;border-radius:10px;background:#fff;font-weight:800}.conj-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}.blankline{display:inline-block;min-width:92px;border-bottom:2px dotted #6f7774;vertical-align:middle;margin:0 6px;height:1.2em}.inline-choice{display:inline-flex!important;vertical-align:middle;margin:0 7px;gap:6px}.choice-sentence{padding:8px 0;border-bottom:1px solid #e3e3e3}.choice-sentence:last-child{border-bottom:0}

<div class="wrap">
  <div class="top"><div><div class="brand">English LZK 19.11</div><div class="sub">Same practice, grouped into three clear topics</div></div><div class="top-actions"><button id="soundBtn" class="sound-btn" type="button" onclick="toggleSound()" aria-label="Toggle sound">🔊 Sound on</button><button id="homeBtn" class="btn hidden" onclick="showHome()">Home</button></div></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sections=['home','info','tests','runner'];
function view(id){sections.forEach(x=>$('#'+x).classList.add('hidden'));$('#'+id).classList.remove('hidden');$('#homeBtn').classList.toggle('hidden',id==='home');window.scrollTo({top:0,behavior:'smooth'});}
function showHome(){renderHome();view('home');}
function norm(s){return String(s||'').trim().toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'');}
function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');}
function shuffled(a){return [...a].sort(()=>Math.random()-.5);}
function soundPref(){return localStorage.getItem('englishLzkSound')!=='off';}
let soundEnabled=soundPref(), audioCtx=null;
function ensureAudio(){
  if(!soundEnabled)return null;
  if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audioCtx=new AC();}
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}
function tone(freq,duration=0.07,volume=0.035,type='sine',delay=0){
  const ctx=ensureAudio();if(!ctx)return;
  const t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+duration);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+duration+0.02);
}
function playClick(){if(!soundEnabled)return;tone(360,0.045,0.018,'sine');}
function playSelect(){if(!soundEnabled)return;tone(470,0.055,0.022,'sine');}
function playSuccess(){if(!soundEnabled)return;tone(523.25,0.09,0.035,'sine',0);tone(659.25,0.11,0.03,'sine',0.075);tone(783.99,0.14,0.026,'sine',0.15);}
function playTryAgain(){if(!soundEnabled)return;tone(260,0.09,0.028,'triangle',0);tone(196,0.13,0.024,'triangle',0.09);}
function playResult(correct,total){if(total>0&&correct===total)playSuccess();else playTryAgain();}
function updateSoundButton(){const b=document.getElementById('soundBtn');if(!b)return;b.textContent=soundEnabled?'🔊 Sound on':'🔇 Sound off';b.setAttribute('aria-pressed',soundEnabled?'true':'false');}
function toggleSound(){soundEnabled=!soundEnabled;localStorage.setItem('englishLzkSound',soundEnabled?'on':'off');updateSoundButton();if(soundEnabled){ensureAudio();playSuccess();}}

const topics={
 have:{icon:'&#129386;',title:'Have got',desc:'possession: positive, negative, questions and short answers',exercises:['haveComplete','haveQuestions']},
 present:{icon:'&#9728;',title:'Present simple + to be',desc:'present simple verbs, verb conjugation and am / is / are',exercises:['presentFill','presentConjugator','bePresentSheet']},
 past:{icon:'&#9201;',title:'Past simple + was / were',desc:'was/were, regular verbs, spelling and irregular verbs',exercises:['wasWereSheet','regularForms','pastSentences','irregularTable']}
};
const labels={
 haveComplete:'Worksheet 1: Complete have got',haveQuestions:'Worksheet 2: Questions + short answers',
 presentFill:'Worksheet 1: Present simple - 13 sentences',presentConjugator:'Worksheet 2: Verb conjugator',bePresentSheet:'Worksheet 3: To be - present',
 wasWereSheet:'Worksheet 1: Was / were',regularForms:'Worksheet 2: Regular past forms + spelling',pastSentences:'Worksheet 3: Past simple in sentences',irregularTable:'Worksheet 4: Irregular verbs'
};
function normalizeScoreRecord(r){
 if(!r)return null;
 if(typeof r.score==='number'&&typeof r.last!=='number')return {last:r.score,best:r.score,attempts:1,at:r.at||0,history:[r.score]};
 const history=Array.isArray(r.history)?r.history.filter(x=>typeof x==='number').slice(-10):[];
 const last=typeof r.last==='number'?r.last:(history.length?history[history.length-1]:null);
 if(last===null)return null;
 return {last,best:typeof r.best==='number'?r.best:Math.max(last,...history),attempts:Number.isFinite(r.attempts)?r.attempts:Math.max(1,history.length),at:r.at||0,history:history.length?history:[last]};
}
function getDone(){
 try{
  const raw=JSON.parse(localStorage.getItem('englishLzkDoneV3')||'{}'),out={};
  Object.entries(raw).forEach(([k,v])=>{const n=normalizeScoreRecord(v);if(n)out[k]=n});
  return out;
 }catch(e){return {}}
}
function scoreRecord(id){return getDone()[id]||null;}
function saveDone(id,score){
 const d=getDone(),old=d[id]||null,history=[...(old?.history||[]),score].slice(-10);
 const rec={last:score,best:old?Math.max(old.best,score):score,attempts:(old?.attempts||0)+1,at:Date.now(),history};
 d[id]=rec;localStorage.setItem('englishLzkDoneV3',JSON.stringify(d));return {record:rec,previous:old?.last??null};
}
function scoreSummary(id,compact=false){
 const r=scoreRecord(id);if(!r)return compact?'Not completed yet':'No previous score on this device.';
 return compact?`Last ${r.last}% · Best ${r.best}% · ${r.attempts} ${r.attempts===1?'attempt':'attempts'}`:`Previous score on this device: <strong>${r.last}%</strong> · Best: <strong>${r.best}%</strong> · Attempts: <strong>${r.attempts}</strong>`;
}
function previousScoreBanner(id){const r=scoreRecord(id);return r?`<div class="feedback info" style="margin-top:0">${scoreSummary(id,false)}</div>`:'';}
function topicStatus(key){const d=getDone(), list=topics[key].exercises, n=list.filter(x=>d[x]).length;return `${n}/${list.length} worksheets completed`;}
function renderHome(){
 $('#home').innerHTML=`<div class="card"><h2 style="margin-top:0">What do you want to do?</h2><div class="grid"><button class="tile" onclick="showInfo()"><div class="emoji">&#128214;</div><h3>Info</h3><p>All rules in three topics.</p></button><button class="tile" onclick="showTests()"><div class="emoji">&#9997;</div><h3>Tests</h3><p>Three topics. Finish one worksheet at a time.</p></button></div></div>`;
}
function showInfo(){
 $('#info').innerHTML=`<div class="card"><div class="crumb">Info</div><h2 class="section-title">What she needs for the test</h2>
 <div class="rulebox"><h4>1. Have got</h4><table class="rule-table"><tr><th>Subject</th><th>Positive</th><th>Negative</th></tr><tr><td>I / you / we / they</td><td><strong>have got</strong></td><td><strong>haven't got</strong></td></tr><tr><td>he / she / it</td><td><strong>has got</strong></td><td><strong>hasn't got</strong></td></tr></table><p><strong>Questions:</strong> Have you got ...? / Has he got ...?</p><p><strong>Short answers:</strong> Yes, I have. / No, I haven't. / Yes, he has. / No, he hasn't.</p></div>
 <div class="rulebox"><h4>2. Present simple + to be</h4><p><strong>Present simple:</strong> I/you/we/they eat, look, reduce. He/she/it <strong>eats, looks, reduces</strong>.</p><p><strong>Remember:</strong> he, she, it - the <strong>-s</strong> must come with it.</p><table class="rule-table"><tr><th>Subject</th><th>to be - present</th></tr><tr><td>I</td><td><strong>am</strong></td></tr><tr><td>you</td><td><strong>are</strong></td></tr><tr><td>he / she / it</td><td><strong>is</strong></td></tr><tr><td>we / you / they</td><td><strong>are</strong></td></tr></table></div>
 <div class="rulebox"><h4>3. Past simple + was / were</h4><div class="two-cols"><div><p><strong>to be - past:</strong></p><table class="rule-table"><tr><td>I / he / she / it</td><td><strong>was</strong></td></tr><tr><td>you / we / they</td><td><strong>were</strong></td></tr></table><p>Negative: <strong>wasn't</strong>, <strong>weren't</strong>.</p></div><div><p><strong>Regular verbs:</strong> usually add <strong>-ed</strong>.</p><p>smile - smiled<br>try - tried<br>stop - stopped<br>plan - planned</p></div></div>
 <p class="subhead">Irregular verbs from CB p.34</p><table class="rule-table irregular-table"><tr><th>Present simple</th><th>Past simple</th></tr>${Object.entries(irregular).map(([a,b])=>`<tr><td>${a}</td><td><strong>${b}</strong></td></tr>`).join('')}</table></div>
 <div class="row"><button class="btn" onclick="showHome()">Back</button><button class="btn primary" onclick="showTests()">Go to tests</button></div></div>`;view('info');
}
function showTests(){
 $('#tests').innerHTML=`<div class="card"><div class="crumb">Tests</div><h2 class="section-title">Three topics</h2><p class="muted">The amount of practice is the same, but it is grouped into complete worksheets so each section feels finished.</p><div class="grid">${Object.entries(topics).map(([k,t])=>`<button class="tile" onclick="openTopic('${k}')"><div class="emoji">${t.icon}</div><h3>${t.title}</h3><p>${t.desc}</p><div class="status">${topicStatus(k)}</div></button>`).join('')}</div><div class="row" style="margin-top:18px"><button class="btn" onclick="showHome()">Back</button><button class="btn" onclick="startMixed()">Final mixed review${scoreRecord('mixed')?` · ${scoreRecord('mixed').last}% last`:' '}</button></div></div>`;view('tests');
}
function openTopic(key){
 const t=topics[key], d=getDone();
 $('#tests').innerHTML=`<div class="card"><div class="crumb">Tests &rsaquo; ${t.title}</div><div class="topic-banner"><div><strong>${t.icon} ${t.title}</strong><div class="muted">${t.desc}</div></div><div class="completion">${topicStatus(key)}</div></div><div class="grid">${t.exercises.map((id,i)=>`<button class="tile" onclick="startExercise('${id}','${key}')"><h3>Part ${i+1}</h3><p>${labels[id]}</p><div class="status">${d[id]?`&#10003; ${scoreSummary(id,true)}`:'Not completed yet'}</div></button>`).join('')}</div><div class="row" style="margin-top:18px"><button class="btn" onclick="showTests()">&larr; Three topics</button></div></div>`;view('tests');
}

 ['I always','(to wake up) early in the morning.','wake up'],['She usually','(to go) jogging in the park.','goes'],['They often','(to visit) their grandparents on weekends.','visit'],['Anna sometimes','(to forget) to water the plants.','forgets'],['We rarely','(to eat) at restaurants.','eat'],['He','(to buy) groceries at the supermarket on weekends.','buys'],['Liza','(to fly) to different countries for work.','flies'],['The bus','(to arrive) hourly at the station.','arrives'],['Jane never','(to miss) her yoga class.','misses'],['Peter always','(to help) his friends with their homework.','helps'],['They seldom','(to watch) TV during the week.','watch'],['We','(to sing) beautifully in the choir every Sunday.','sing'],['Marc','(to carry) his backpack to school every day.','carries']

};

const wasWereSent=[['I','at school from 8 to 3 p.m.','was'],['They','very busy all day yesterday.','were'],['My friends','in Croatia last year.','were'],['My sister','very tired in the evening.','was'],["My father's old car",'green and blue.','was'],['Jakob and Susi','very excited to see you.','were'],['My mum','asleep at 9 p.m.','was']];
const underlineText=`Yesterday was a great day. It wasn't a normal day; it was my birthday. My friends and I weren't at school, we were in a zoo. There were a lot of animals. My favourite animal wasn't the elephant, it was the giraffe. There was a very tall one. I was very happy. At lunchtime, we were in a restaurant. We were very hungry, and the food was good. It was a perfect day. How was your last birthday?`;
const beBuild=[['They + (to) be + at school + yesterday.','They were at school yesterday.'],['Linda + (to) be + happy + last week.','Linda was happy last week.'],['I + (to) be + at home + yesterday.','I was at home yesterday.'],['Alex + (to) be + in Italy + last summer.','Alex was in Italy last summer.']];
const regularForms={ask:'asked',play:'played',land:'landed',order:'ordered',push:'pushed',help:'helped',talk:'talked',warn:'warned',point:'pointed',listen:'listened',plan:'planned',move:'moved',travel:'travelled',start:'started',like:'liked',stop:'stopped',smile:'smiled',cry:'cried',dance:'danced',try:'tried',live:'lived',study:'studied',stay:'stayed',shop:'shopped',walk:'walked',carry:'carried',look:'looked',love:'loved',cook:'cooked',work:'worked',pull:'pulled',want:'wanted',bake:'baked',watch:'watched',open:'opened'};
const spellingLines=[['John','stoped','smoking last year.','stopped',true],['Mary','planned','her trip yesterday.','planned',false],['I','danced','on the table.','danced',false],['I','studyed','for the test last week.','studied',true],['I really','likd','her.','liked',true],['I','tryed','to play basketball yesterday.','tried',true],['We','traveled','to Japan last year.','travelled',true],['They','cancelled','their flight.','cancelled',false]];
const pastFill=[['Susi','(play) a game with James last Saturday.','played'],['Marina','(walk) along the beach last summer.','walked'],['Ben','(look) for his wallet in the morning.','looked'],['Ken','(talk) to me at the party last week.','talked'],['The cat','(try) to catch a bird five minutes ago.','tried'],['I','(study) English yesterday.','studied'],['My friends and I','(order) pizza last night.','ordered'],['Dad','(visit) his aunt last Monday.','visited'],['I','(stop) smoking last year.','stopped'],['Eric','(kiss) Sarah at the party last Saturday.','kissed'],['They','(play) the new song last night.','played'],['My parents','(help) me a lot last year.','helped'],['The Millers','(want) to speak to me yesterday.','wanted'],['Kevin','(cry) a lot yesterday.','cried'],['Amy and Maggie','(clean) the whole house yesterday.','cleaned'],['We','(travel) to Spain last year.','travelled']];
const pastBuild=[['HE + (to) watch + TV + yesterday','He watched TV yesterday.'],['THEY + (to) talk + to me + last week','They talked to me last week.'],['I + (to) play + football + last Friday','I played football last Friday.'],['WE + (to) help + her + 5 minutes ago','We helped her 5 minutes ago.'],['MUM + (to) bake + a cake + yesterday','Mum baked a cake yesterday.'],['TOM + (to) cook + pasta + last week','Tom cooked pasta last week.'],['YOUR DOG + (to) play + with me','Your dog played with me.']];
const irregular={have:'had',go:'went',wear:'wore',do:'did',take:'took',make:'made',give:'gave',hear:'heard',write:'wrote',see:'saw'};

let current={id:null,topic:null};
function startExercise(id,topic){current={id,topic};renderExercise();const card=$('#runner .card');if(card){const b=previousScoreBanner(id);if(b)card.insertAdjacentHTML('afterbegin',b)}view('runner');}
function renderExercise(){const id=current.id;let body='';if(id==='haveComplete')body=renderHaveComplete();if(id==='haveQuestions')body=renderHaveQuestions();if(id==='presentFill')body=renderPresentFill();if(id==='presentConjugator')body=renderPresentConjugator();if(id==='bePresentSheet')body=renderBePresent();if(id==='wasWereSheet')body=renderWasWere();if(id==='regularForms')body=renderRegularForms();if(id==='pastSentences')body=renderPastSentences();if(id==='irregularTable')body=renderIrregular();$('#runner').innerHTML=`<div class="card"><div class="crumb">${topics[current.topic].title} &rsaquo; ${labels[id]}</div>${body}<div class="row" style="margin-top:18px"><button class="btn" onclick="openTopic('${current.topic}')">&larr; Back to ${topics[current.topic].title}</button></div></div>`;if(id==='presentConjugator')resetConjugator();}
function resultBox(correct,total){
 const pct=Math.round(correct/total*100),saved=saveDone(current.id,pct),r=saved.record;playResult(correct,total);
 const compare=saved.previous===null?`First saved attempt on this device.`:`Previous: <strong>${saved.previous}%</strong> · Best: <strong>${r.best}%</strong> · Attempts: <strong>${r.attempts}</strong>`;
 return `<div class="feedback ${correct===total?'ok':'bad'}">${correct===total?'Everything is correct.':'Finished. Check the red corrections.'} <strong>${correct}/${total} correct (${pct}%).</strong><div style="margin-top:6px;font-size:13px">${compare}</div></div>`;
}
function markInput(el,ok,answer){el.classList.add(ok?'good':'bad');el.disabled=true;if(!ok)el.insertAdjacentHTML('afterend',`<span class="correction">Correct: ${answer}</span>`);}
function renderHaveComplete(){const rows=[...havePos.map(r=>[...r,'pos']),...haveNeg.map(r=>[...r,'neg'])];return `<div class="worksheet"><h2>HAVE GOT</h2><p class="directions">Complete the sentences. <strong>+</strong> = positive, <strong>-</strong> = negative.</p><div class="sheet-grid">${rows.map((r,i)=>`<div class="sheet-row"><div class="sentence-line"><span class="polarity ${r[3]}">${r[3]==='pos'?'+':'-'}</span>${i+1}. ${r[0]} <input class="gap-input answer" data-answer="${r[2]}" autocomplete="off" spellcheck="false"> ${r[1]}</div><div></div></div>`).join('')}</div></div><div id="feedback"></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="checkSimpleInputs()">Check worksheet</button></div>`;}
function checkSimpleInputs(){let c=0,total=0;$$('.answer').forEach(el=>{total++;const ok=norm(el.value)===norm(el.dataset.answer);if(ok)c++;markInput(el,ok,el.dataset.answer)});$('#feedback').innerHTML=resultBox(c,total);const b=$('.btn.primary');if(b)b.disabled=true;}
function renderHaveQuestions(){return `<div class="worksheet"><h2>HAVE GOT - QUESTIONS</h2><div class="part"><h3>1. Make questions.</h3>${haveQ.map((o,i)=>`<div class="sheet-row"><div class="question-line">${i+1}. <input class="inline-input hq1" data-a="${o.a1}"> ${o.subject} <input class="inline-input hq2" data-a="${o.a2}"> ${o.after}</div><div class="answer-key hqkey"></div></div>`).join('')}</div><div class="part"><h3>2. Write the short answer.</h3>${shortAns.map((o,i)=>`<div class="sheet-row"><div><div class="question-line">${i+1}. ${o.q}</div><div class="muted">Write a ${o.want==='yes'?'positive':'negative'} short answer.</div></div><input class="input short" data-answer="${o.a}" autocomplete="off"></div>`).join('')}</div></div><div id="feedback"></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="checkHaveQuestions()">Check worksheet</button></div>`;}
function checkHaveQuestions(){let c=0,total=0;$$('.hq1').forEach((el,i)=>{const el2=$$('.hq2')[i];const ok1=norm(el.value)===norm(el.dataset.a),ok2=norm(el2.value)===norm(el2.dataset.a);total+=2;if(ok1)c++;if(ok2)c++;markInput(el,ok1,el.dataset.a);markInput(el2,ok2,el2.dataset.a)});$$('.short').forEach(el=>{total++;const ok=norm(el.value)===norm(el.dataset.answer);if(ok)c++;markInput(el,ok,el.dataset.answer)});$('#feedback').innerHTML=resultBox(c,total);$('.btn.primary').disabled=true;}
function renderPresentFill(){return `<div class="worksheet"><h2>SIMPLE PRESENT</h2><p class="directions">Write the verb in its correct form. All sentences are positive (+).</p>${presentItems.map((r,i)=>`<div class="sheet-row"><div class="sentence-line"><span class="polarity pos">+</span>${i+1}. ${r[0]} <input class="gap-input answer" data-answer="${r[2]}" autocomplete="off" spellcheck="false"> ${r[1]}</div><div></div></div>`).join('')}</div><div id="feedback"></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="checkSimpleInputs()">Check worksheet</button></div>`;}
function renderPresentConjugator(){const verbs=Object.keys(presentConj);return `<div class="worksheet"><h2>PRESENT SIMPLE - VERB CONJUGATOR</h2><p class="directions">Choose a verb, then conjugate it for all pronouns.</p><div class="conj-head"><label><strong>Verb:</strong> <select id="conjVerb" class="conj-select" onchange="resetConjugator()">${verbs.map(v=>`<option value="${v}">${v}</option>`).join('')}</select></label><span class="muted">Remember: he / she / it usually changes.</span></div><div id="conjTable"></div></div><div id="feedback"></div><div class="row" style="margin-top:14px"><button id="conjCheck" class="btn primary" onclick="checkPresentConjugator()">Check this verb</button><button class="btn" onclick="chooseAnotherConjVerb()">Choose another verb</button></div>`;}
function resetConjugator(){const v=$('#conjVerb').value,forms=presentConj[v];$('#conjTable').innerHTML=`<table class="mini-table"><tr><th>pronoun</th><th>${v}</th></tr>${conjPronouns.map(([p,k])=>`<tr><td>${p}</td><td><input class="small-input conj-answer" data-answer="${forms[k]}" autocomplete="off" spellcheck="false"></td></tr>`).join('')}</table>`;$('#feedback').innerHTML='';$('#conjCheck').disabled=false;}
function chooseAnotherConjVerb(){const sel=$('#conjVerb'),opts=[...sel.options],idx=opts.findIndex(o=>o.value===sel.value);sel.selectedIndex=(idx+1)%opts.length;resetConjugator();}
function checkPresentConjugator(){let c=0,total=0;$$('.conj-answer').forEach(el=>{total++;const ok=norm(el.value)===norm(el.dataset.answer);if(ok)c++;markInput(el,ok,el.dataset.answer)});$('#feedback').innerHTML=resultBox(c,total)+`<div class="feedback info">You can choose another verb from the dropdown and practise again.</div>`;$('#conjCheck').disabled=true;}
function renderBePresent(){return `<div class="worksheet"><h2>THE VERB BE - PRESENT</h2><div class="part"><h3>1. Complete the table.</h3><table class="mini-table"><tr><th>pronoun</th><th>am / is / are</th></tr>${bePresentRows.map(r=>`<tr><td>${r[0]}</td><td><input class="small-input answer" data-answer="${r[1]}"></td></tr>`).join('')}</table></div><div class="part"><h3>2. Complete the sentences.</h3>${bePresentSent.map((r,i)=>`<div class="sheet-row"><div class="sentence-line"><span class="polarity pos">+</span>${i+1}. ${r[0]} <input class="gap-input answer" data-answer="${r[2]}"> ${r[1]}</div><div></div></div>`).join('')}</div></div><div id="feedback"></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="checkSimpleInputs()">Check worksheet</button></div>`;}
function renderWasWere(){window.underlineSelected=new Set();window.wasPick={};return `<div class="worksheet"><h2>PAST SIMPLE - WAS / WERE</h2><div class="part"><h3>1. Complete the table.</h3><table class="mini-table"><tr><th>pronoun</th><th>was / were</th></tr>${wasWereRows.map(r=>`<tr><td>${r[0]}</td><td><div class="choice-pair"><button class="pick waspick" data-answer="${r[1]}" data-value="was" onclick="pickWas(this)">was</button><button class="pick waspick" data-answer="${r[1]}" data-value="were" onclick="pickWas(this)">were</button></div></td></tr>`).join('')}</table></div><div class="part"><h3>2. Select was or were.</h3>${wasWereSent.map((r,i)=>`<div class="choice-sentence sentence-line">${i+1}. ${r[0]} <span class="choice-pair inline-choice"><button class="pick sentpick" data-group="s${i}" data-answer="${r[2]}" data-value="was" onclick="pickGrouped(this)">was</button><button class="pick sentpick" data-group="s${i}" data-answer="${r[2]}" data-value="were" onclick="pickGrouped(this)">were</button></span> ${r[1]}</div>`).join('')}</div><div class="part"><h3>3. Read the text and underline all forms of was(n't) and were(n't).</h3><div class="clicktext">${tokenize(underlineText).map((t,i)=>/^\s+$/.test(t)?t:`<span class="word" data-i="${i}" onclick="toggleUnderline(this)">${t}</span>`).join('')}</div></div><div class="part"><h3>4. Form positive sentences.</h3>${beBuild.map((r,i)=>`<div class="sheet-row"><div>${i+1}. ${r[0]}</div><input class="input build" data-answer="${r[1]}"></div>`).join('')}</div></div><div id="feedback"></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="checkWasWere()">Check worksheet</button></div>`;}
function pickWas(btn){if(btn.disabled)return;playSelect();const td=btn.closest('td');td.querySelectorAll('.pick').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');}
function pickGrouped(btn){if(btn.disabled)return;playSelect();const g=btn.dataset.group;$$(`.sentpick[data-group="${g}"]`).forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');}
function tokenize(text){return text.match(/[A-Za-z]+(?:n't|'[A-Za-z]+)?|[^A-Za-z\s]+|\s+/g)||[];}
function toggleUnderline(el){if(el.classList.contains('locked'))return;playSelect();el.classList.toggle('selected');}
function checkWasWere(){let c=0,total=0;
 $$('.waspick').forEach(btn=>btn.disabled=true);$$('.mini-table tr').slice(1).forEach(tr=>{total++;const picks=[...tr.querySelectorAll('.waspick')],sel=picks.find(x=>x.classList.contains('selected')),ans=picks[0].dataset.answer;if(sel&&sel.dataset.value===ans){c++;sel.classList.add('correct')}else{if(sel)sel.classList.add('wrong');const correct=picks.find(x=>x.dataset.value===ans);correct.classList.add('correct')}});
 wasWereSent.forEach((r,i)=>{total++;const picks=$$(`.sentpick[data-group="s${i}"]`);picks.forEach(x=>x.disabled=true);const sel=picks.find(x=>x.classList.contains('selected'));if(sel&&sel.dataset.value===r[2]){c++;sel.classList.add('correct')}else{if(sel)sel.classList.add('wrong');picks.find(x=>x.dataset.value===r[2]).classList.add('correct')}});
 const valid=new Set(['was',"wasn't",'were',"weren't"]);$$('.word').forEach(el=>el.classList.add('locked'));const toks=tokenize(underlineText);let underGood=true;toks.forEach((t,i)=>{if(/^\s+$/.test(t))return;const el=$(`.word[data-i="${i}"]`),target=valid.has(t.toLowerCase()),selected=el.classList.contains('selected');if(target&&selected){el.classList.add('correct')}else if(target&&!selected){underGood=false;el.classList.add('mistake')}else if(!target&&selected){underGood=false;el.classList.add('mistake')}});total++;if(underGood)c++;
 $$('.build').forEach(el=>{total++;const ok=norm(el.value)===norm(el.dataset.answer);if(ok)c++;markInput(el,ok,el.dataset.answer)});
 $('#feedback').innerHTML=resultBox(c,total)+`<div class="feedback info">In the underline exercise, correct selections are green. Anything missed or selected by mistake is red.</div>`;$('.btn.primary').disabled=true;}
function renderRegularForms(){const entries=Object.entries(regularForms);return `<div class="worksheet"><h2>PAST SIMPLE - REGULAR VERBS</h2><div class="part"><h3>1. Form the Past Tense.</h3><table class="mini-table"><tr><th>verb</th><th>past simple</th></tr>${entries.map(([v,a])=>`<tr><td>(to) ${v}</td><td><input class="small-input regform" data-answer="${a}" autocomplete="off"></td></tr>`).join('')}</table></div><div class="part"><h3>2. Can you find all five spelling mistakes?</h3><p class="muted">Click the verb that is spelled incorrectly.</p>${spellingLines.map((r,i)=>`<div class="sheet-row"><div class="question-line">${i+1}. ${r[0]} <span class="spell-word" data-i="${i}" data-wrong="${r[4]}" data-correct="${r[3]}" onclick="toggleSpell(this)">${r[1]}</span> ${r[2]}</div><div></div></div>`).join('')}</div></div><div id="feedback"></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="checkRegularForms()">Check worksheet</button></div>`;}
function toggleSpell(el){if(el.classList.contains('locked'))return;playSelect();el.classList.toggle('selected');}
function checkRegularForms(){let c=0,total=0;$$('.regform').forEach(el=>{total++;const ok=norm(el.value)===norm(el.dataset.answer);if(ok)c++;markInput(el,ok,el.dataset.answer)});let spellGood=true;$$('.spell-word').forEach(el=>{el.classList.add('locked');const wrong=el.dataset.wrong==='true',selected=el.classList.contains('selected');if(wrong&&selected){el.classList.add('correct')}else if(wrong&&!selected){spellGood=false;el.classList.add('mistake');el.insertAdjacentHTML('afterend',` <span class="correction">${el.dataset.correct}</span>`)}else if(!wrong&&selected){spellGood=false;el.classList.add('mistake')}});total++;if(spellGood)c++;$('#feedback').innerHTML=resultBox(c,total);$('.btn.primary').disabled=true;}
function renderPastSentences(){return `<div class="worksheet"><h2>PAST SIMPLE - REGULAR VERBS</h2><div class="part"><h3>1. Complete the sentences with the Past Tense.</h3>${pastFill.map((r,i)=>`<div class="sheet-row"><div class="sentence-line"><span class="polarity pos">+</span>${i+1}. ${r[0]} <input class="gap-input answer" data-answer="${r[2]}"> ${r[1]}</div><div></div></div>`).join('')}</div><div class="part"><h3>2. Form positive sentences in the Past Tense.</h3>${pastBuild.map((r,i)=>`<div class="sheet-row"><div>${i+1}. ${r[0]}</div><input class="input answer" data-answer="${r[1]}"></div>`).join('')}</div></div><div id="feedback"></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="checkSimpleInputs()">Check worksheet</button></div>`;}
function renderIrregular(){return `<div class="worksheet"><h2>PAST SIMPLE - IRREGULAR VERBS</h2><p class="directions">Complete the table with the Past Simple form.</p><table class="mini-table irregular-table"><tr><th>Present simple</th><th>Past simple</th></tr>${Object.entries(irregular).map(([v,a])=>`<tr><td>${v}</td><td><input class="small-input answer" data-answer="${a}" autocomplete="off"></td></tr>`).join('')}</table></div><div id="feedback"></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="checkSimpleInputs()">Check worksheet</button></div>`;}

function startMixed(){current={id:'mixed',topic:'past'};const pool=[];presentItems.slice(0,5).forEach(r=>pool.push({q:`${r[0]} ___ ${r[1]}`,a:r[2]}));wasWereSent.slice(0,4).forEach(r=>pool.push({q:`${r[0]} ___ ${r[1]}`,a:r[2]}));havePos.slice(0,3).forEach(r=>pool.push({q:`${r[0]} ___ ${r[1]}`,a:r[2]}));Object.entries(irregular).slice(0,4).forEach(([v,a])=>pool.push({q:`Past Simple of "${v}"`,a}));window.mixedItems=shuffled(pool).slice(0,15);$('#runner').innerHTML=`<div class="card">${previousScoreBanner('mixed')}<div class="crumb">Final mixed review</div><div class="worksheet"><h2>MIXED REVIEW</h2><p class="directions">Complete all 15 questions.</p>${mixedItems.map((o,i)=>`<div class="sheet-row"><div>${i+1}. ${o.q}</div><input class="input answer" data-answer="${o.a}"></div>`).join('')}</div><div id="feedback"></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="checkMixedSheet()">Check review</button><button class="btn" onclick="showTests()">Back to three topics</button></div></div>`;view('runner');}
function checkMixedSheet(){let c=0,total=0;$$('.answer').forEach(el=>{total++;const ok=norm(el.value)===norm(el.dataset.answer);if(ok)c++;markInput(el,ok,el.dataset.answer)});$('#feedback').innerHTML=resultBox(c,total);$('.btn.primary').disabled=true;}

document.addEventListener('pointerdown',e=>{const b=e.target.closest('button,.tile');if(b&&b.id!=='soundBtn'&&!b.disabled)playClick();});
updateSoundButton();
renderHome();
</script>
